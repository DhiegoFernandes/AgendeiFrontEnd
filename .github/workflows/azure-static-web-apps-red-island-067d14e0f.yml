name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Usa Node 20 — obrigatório para Vite 7
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Instala dependências e gera a pasta dist/
      - name: Install dependencies and build
        working-directory: ./clientApp
        run: |
          npm install
          npm run build

      # Faz o upload do build para o Azure SWA
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_ISLAND_067D14E0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # Caminho do código (onde está o package.json)
          app_location: "./clientApp"

          # API (não usada)
          api_location: ""

          # Vite usa dist/
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_ISLAND_067D14E0F }}
          action: "close"
